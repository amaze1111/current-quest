# No `databases:` block here — this service reuses an existing free Postgres instance
# shared with another app, isolated via the current_quest schema (see migrations/001_init.sql
# and src/db/pool.ts). Set DATABASE_URL manually in the Render dashboard to that instance's
# connection string; it is not provisioned by this file.

services:
  - type: web
    name: current-quest-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOW_DEV_AUTH
        value: "false"
      # Secrets — set these in the Render dashboard, never given values here.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: ANDROID_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64
        sync: false
