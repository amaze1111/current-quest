databases:
  - name: current-quest-db
    plan: free
    databaseName: current_quest
    user: current_quest

services:
  - type: web
    name: current-quest-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: current-quest-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOW_DEV_AUTH
        value: "false"
      # Secrets — set these in the Render dashboard, never given values here.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: ANDROID_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64
        sync: false
